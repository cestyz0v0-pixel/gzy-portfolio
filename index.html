<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guizhu YUE | Art Direction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff; 
            background-color: #000000; 
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Sidebar - Fixed and clean */
        .sidebar {
            width: 280px;
            padding: 70px 45px;
            position: absolute;
            top: 0; 
            left: 0; 
            height: 100vh;
            z-index: 100;
            pointer-events: none; 
        }
        .sidebar * { pointer-events: auto; }
        .sidebar h1 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; letter-spacing: 2px; text-transform: uppercase; }
        .sidebar .subtitle { font-size: 0.58rem; color: #555555; margin-bottom: 55px; text-transform: uppercase; letter-spacing: 1.5px; }
        .contact-label { font-size: 0.58rem; color: #3f3f3f; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .contact-value { font-size: 0.68rem; color: #888888; margin-bottom: 25px; }
        .contact-value a { color: #888888; text-decoration: none; }

        /* Main Viewport */
        .main-content {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; 
            perspective: 2500px; 
            background: #000000;
        }
        
        /* Stable Carousel Stage */
        .carousel-stage {
            width: 200px;
            height: 280px; 
            position: relative;
            transform-style: preserve-3d;
            transform: translateY(-80px); /* Centered and slightly elevated */
            animation: stableSpin 60s infinite linear;
        }
        
        .portfolio-item {
            position: absolute;
            width: 200px; 
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            opacity: 0.90;
            transition: transform 0.6s cubic-bezier(0.2, 1, 0.3, 1), opacity 0.4s ease;
            backface-visibility: visible;
        }
        
        .portfolio-item img {
            width: 100%;
            height: auto; 
            object-fit: contain; 
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            background-color: #050505;
        }
        
        .item-info {
            padding-top: 10px;
            font-size: 0.6rem;
            color: #444444;
            text-align: center;
        }

        /* Hover Effect - Clean Frontal Snap */
        .carousel-stage:has(.portfolio-item:hover) .portfolio-item:not(:hover) {
            opacity: 0.1;
        }

        .portfolio-item:hover {
            opacity: 1 !important;
            z-index: 100;
            /* Snaps to the front perfectly flat */
            transform: var(--current-transform) translateZ(150px) scale(1.4) !important;
        }

        /* Stable Rotation */
        @keyframes stableSpin {
            from { transform: rotateX(-10deg) rotateY(0deg); }
            to { transform: rotateX(-10deg) rotateY(-360deg); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Guizhu YUE</h1> 
        <div class="subtitle">Art Direction & Visual Strategies</div>
        <div class="contact-label">TEL</div>
        <div class="contact-value"><a href="tel:+330695285161">+33 06 95 28 51 61</a></div>
        <div class="contact-label">MAIL</div>
        <div class="contact-value"><a href="mailto:guizhu.yue@eicar.fr">guizhu.yue@eicar.fr</a></div>
    </div>

    <div class="main-content">
        <div class="carousel-stage" id="stage">
            <a href="project1.html" class="portfolio-item"><img src="p1.jpg"><div class="item-info">01</div></a>
            <a href="project2.html" class="portfolio-item"><img src="p2.jpg"><div class="item-info">02</div></a>
            <a href="project3.html" class="portfolio-item"><img src="p3.jpg"><div class="item-info">03</div></a>
            <a href="project4.html" class="portfolio-item"><img src="p4.jpg"><div class="item-info">04</div></a>
            <a href="project5.html" class="portfolio-item"><img src="p5.jpg"><div class="item-info">06</div></a>
            <a href="project6.html" class="portfolio-item"><img src="p6.jpg"><div class="item-info">06</div></a>
            <a href="project7.html" class="portfolio-item"><img src="p7.jpg"><div class="item-info">07</div></a>
            <a href="project8.html" class="portfolio-item"><img src="p8.jpg"><div class="item-info">08</div></a>
        </div>
    </div>

    <script>
        const items = document.querySelectorAll('.portfolio-item');
        const radius = 250;
        items.forEach((item, index) => {
            const angle = (360 / items.length) * index;
            // Stable cylindrical layout
            const transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
            item.style.transform = transform;
            item.style.setProperty('--current-transform', transform);
        });
    </script>
</body>
</html>
