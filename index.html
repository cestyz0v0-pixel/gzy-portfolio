<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guizhu YUE | Art Direction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff; 
            background-color: #000000; 
            display: flex;
            flex-direction: row;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Section */
        .sidebar {
            width: 320px;
            padding: 60px 40px;
            position: fixed;
            top: 0; 
            left: 0; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border-right: 1px solid #111111;
            z-index: 10;
            background-color: #000000;
        }
        .sidebar h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }
        .sidebar .subtitle {
            font-size: 0.85rem;
            color: #888888;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .contact-item {
            margin-bottom: 25px;
        }
        .contact-label {
            font-size: 0.7rem;
            color: #444444;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .contact-value {
            font-size: 0.95rem;
            color: #aaaaaa;
            word-break: break-all;
        }
        .contact-value a {
            color: #aaaaaa;
            text-decoration: none;
            transition: color 0.3s;
        }
        .contact-value a:hover {
            color: #ffffff;
        }

        /* 3D Scene Viewport */
        .main-content {
            margin-left: 320px;
            flex: 1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 2000px; 
            overflow: hidden;
        }
        
        /* 🌟 The 3D Carousel Stage Center - CSS Animation handles the permanent auto-spin 🌟 */
        .carousel-stage {
            width: 200px;
            height: 280px; 
            position: relative;
            transform-style: preserve-3d;
            /* Infinite independent smooth rotation loop */
            animation: permanentSpin 45s infinite linear;
        }
        
        /* Individual 3D Portfolio Items */
        .portfolio-item {
            position: absolute;
            width: 200px; 
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: transparent;
            text-decoration: none;
            cursor: pointer;
            
            /* Layered elegant overlap density look */
            opacity: 0.45;
            filter: grayscale(10%);
            
            /* Cinematic smooth extraction transition */
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.4s ease, 
                        filter 0.4s ease;
                        
            backface-visibility: visible; 
            display: block;
        }
        
        /* Responsive scaling down to target native dimensions without any deformation */
        .portfolio-item img {
            width: 100%;
            height: auto; 
            max-height: 280px; 
            object-fit: contain; 
            display: block;
            border-radius: 2px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85);
            background-color: #050505; 
        }
        
        /* Clean Technical Label */
        .item-info {
            padding-top: 10px;
            font-size: 0.75rem;
            color: #444444;
            letter-spacing: 2px;
            text-align: center;
            text-transform: uppercase;
            transition: color 0.4s;
        }

        /* Spotlight Focus Effects */
        .carousel-stage:has(.portfolio-item:hover) .portfolio-item:not(:hover) {
            opacity: 0.12;
            filter: grayscale(60%) blur(1px);
        }

        .portfolio-item:hover {
            opacity: 1 !important;
            filter: grayscale(0%) !important;
            z-index: 100;
            
            /* Shoots forward out of the spinning cylinder axis directly at the user */
            transform: var(--current-transform) translateZ(140px) scale(1.4) !important;
        }
        
        .portfolio-item:hover .item-info {
            color: #ffffff;
        }

        /* 🌟 Pure Mathematical Permanent Spinning Timeline - Locks rotation axis perfectly 🌟 */
        @keyframes permanentSpin {
            0% { transform: rotateX(-12deg) rotateY(0deg); }
            100% { transform: rotateX(-12deg) rotateY(-360deg); }
        }

        /* Responsive Mobile Layout Replacement */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            .sidebar {
                width: 100%; position: relative; height: auto;
                padding: 40px 25px 20px 25px; border-right: none;
                border-bottom: 1px solid #111111;
            }
            .sidebar .subtitle { margin-bottom: 30px; }
            .main-content { margin-left: 0; height: auto; padding: 40px 20px; overflow: visible; }
            .carousel-stage { 
                width: 100%; height: auto; display: flex; flex-direction: column; 
                gap: 40px; transform: none !important; animation: none !important; 
            }
            .portfolio-item { 
                position: relative; width: 100%; transform: none !important; 
                opacity: 1 !important; filter: none !important; box-shadow: none;
            }
            .portfolio-item img { max-height: none; }
            .portfolio-item:hover { transform: scale(1.02) !important; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Guizhu YUE</h1> 
        <div class="subtitle">Art Direction & Visual Strategies</div>
        
        <div class="contact-item">
            <div class="contact-label">TEL</div>
            <div class="contact-value"><a href="tel:+330695285161">+33 06 95 28 51 61</a></div>
        </div>
        
        <div class="contact-item">
            <div class="contact-label">MAIL</div>
            <div class="contact-value"><a href="mailto:guizhu.yue@eicar.fr">guizhu.yue@eicar.fr</a></div>
        </div>
    </div>

    <div class="main-content">
        <div class="carousel-stage" id="stage">
            
            <a href="project1.html" class="portfolio-item"><img src="p1.jpg"><div class="item-info">01</div></a>
            <a href="project2.html" class="portfolio-item"><img src="p2.jpg"><div class="item-info">02</div></a>
            <a href="project3.html" class="portfolio-item"><img src="p3.jpg"><div class="item-info">03</div></a>
            <a href="project4.html" class="portfolio-item"><img src="p4.jpg"><div class="item-info">04</div></a>
            <a href="project5.html" class="portfolio-item"><img src="p5.jpg"><div class="item-info">05</div></a>
            <a href="project6.html" class="portfolio-item"><img src="p6.jpg"><div class="item-info">06</div></a>
            <a href="project7.html" class="portfolio-item"><img src="p7.jpg"><div class="item-info">07</div></a>
            <a href="project8.html" class="portfolio-item"><img src="p8.jpg"><div class="item-info">08</div></a>
            <a href="project9.html" class="portfolio-item"><img src="p9.jpg"><div class="item-info">09</div></a>
            <a href="project10.html" class="portfolio-item"><img src="p10.jpg"><div class="item-info">10</div></a>
            <a href="project11.html" class="portfolio-item"><img src="p11.jpg"><div class="item-info">11</div></a>

        </div>
    </div>

    <script>
        const items = document.querySelectorAll('.portfolio-item');
        const totalItems = items.length;
        
        const angleUnit = 360 / totalItems;
        // Tight depth radius to guarantee the precise overlapping layer look
        const radius = Math.round((200 / 2) / Math.tan(Math.PI / totalItems)) + 45;

        // Spread the items around the circular track and save their core positions
        items.forEach((item, index) => {
            const itemAngle = angleUnit * index;
            const transformString = `rotateY(${itemAngle}deg) translateZ(${radius}px)`;
            item.style.transform = transformString;
            item.style.setProperty('--current-transform', transformString);
        });
    </script>

</body>
</html>
