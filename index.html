<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guizhu YUE | Art Direction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff; 
            background-color: #000000; 
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* 🖋️ Left Side Information Area - Redesigned to Match Reference Tiny Style */
        .sidebar {
            width: 320px;
            padding: 80px 50px;
            position: absolute;
            top: 0; 
            left: 0; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            z-index: 10;
            background-color: transparent; /* Transparent background lets 3D breathe */
            pointer-events: none; /* Allows mouse events to pass through to the space below */
        }
        .sidebar * {
            pointer-events: auto; /* Restores clicking capability for links */
        }
        
        /* The Name Heading - Micro-scaled & uppercase like reference */
        .sidebar h1 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
        }
        /* Subtitle - Tiny editorial tag */
        .sidebar .subtitle {
            font-size: 0.62rem;
            color: #666666;
            margin-bottom: 60px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .contact-item {
            margin-bottom: 30px;
        }
        .contact-label {
            font-size: 0.6rem;
            color: #444444;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .contact-value {
            font-size: 0.72rem;
            color: #888888;
            letter-spacing: 0.5px;
        }
        .contact-value a {
            color: #888888;
            text-decoration: none;
            transition: color 0.3s;
        }
        .contact-value a:hover {
            color: #ffffff;
        }

        /* 🏛️ 3D Viewport - Engineered for absolute center ground alignment */
        .main-content {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; /* PERFECT VERTICAL & HORIZONTAL CENTERING */
            position: relative;
            perspective: 2000px; 
            overflow: hidden;
            background: #000000;
        }
        
        /* The 3D Book Reel Stage Base */
        .carousel-stage {
            width: 180px;
            height: 250px; 
            position: relative;
            transform-style: preserve-3d;
            /* Absolute centering adjustment matrix */
            transform: translateY(0px) rotateX(-12deg); 
            animation: bookFlappingSpin 55s infinite linear;
        }
        
        /* 📖 Individual Book Pages (Opaque, Solid Edge-On Styling) */
        .portfolio-item {
            position: absolute;
            width: 180px; 
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: transparent;
            text-decoration: none;
            cursor: pointer;
            
            /* 🌟 Premium Solid Aspect: 90% Uncompromised Opaque Body 🌟 */
            opacity: 0.90;
            filter: grayscale(5%);
            
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.4s ease, 
                        filter 0.4s ease;
                        
            backface-visibility: visible; 
            display: block;
        }
        
        /* Completely organic scaled original proportions inside the leaf */
        .portfolio-item img {
            width: 100%;
            height: auto; 
            max-height: 250px; 
            object-fit: contain; 
            display: block;
            border-radius: 1px;
            /* Solid structural shadows for overlapping density */
            box-shadow: -12px 15px 35px rgba(0, 0, 0, 0.95);
            background-color: #030303;
        }
        
        /* Micro Index Labels under pages */
        .item-info {
            padding-top: 10px;
            font-size: 0.6rem;
            color: #333333;
            letter-spacing: 2px;
            text-align: center;
            transition: color 0.4s;
        }

        /* Hover System Matrix */
        .carousel-stage:has(.portfolio-item:hover) .portfolio-item:not(:hover) {
            opacity: 0.10; 
            filter: grayscale(80%) blur(1.5px);
        }

        .portfolio-item:hover {
            opacity: 1 !important;
            filter: grayscale(0%) !important;
            z-index: 999;
            transform: var(--hover-flip-transform) !important;
        }
        
        .portfolio-item:hover .item-info {
            color: #ffffff;
        }

        /* 🔄 Continuous Balanced Auto Spinning Timeline */
        @keyframes bookFlappingSpin {
            0% { transform: rotateX(-15deg) rotateY(0deg); }
            100% { transform: rotateX(-15deg) rotateY(-360deg); }
        }

        /* 📱 🌟 High-End Responsive Mobile Transformation: Keeps 3D Ring Intact! 🌟 */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: hidden; position: relative; }
            
            /* Top Muted Layout for Mobile Sidebar */
            .sidebar {
                width: 100vw; height: auto; position: relative;
                padding: 40px 30px 10px 30px; border-right: none;
            }
            .sidebar .subtitle { margin-bottom: 25px; }
            .sidebar .contact-item { display: inline-block; margin-right: 30px; margin-bottom: 15px; }
            
            /* Center Viewport on Phone scales down visually to fit perfectly without cracking */
            .main-content { 
                flex: 1; width: 100vw; height: auto;
                display: flex; justify-content: center; align-items: center;
                /* Shrinks the viewport scale to neatly contain the full 3D layout on portrait screens */
                transform: scale(0.85); 
            }
            .carousel-stage {
                transform: translateY(-40px) rotateX(-15deg);
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Guizhu YUE</h1> 
        <div class="subtitle">Art Direction & Visual Strategies</div>
        
        <div class="contact-item">
            <div class="contact-label">TEL</div>
            <div class="contact-value"><a href="tel:+330695285161">+33 06 95 28 51 61</a></div>
        </div>
        
        <div class="contact-item">
            <div class="contact-label">MAIL</div>
            <div class="contact-value"><a href="mailto:guizhu.yue@eicar.fr">guizhu.yue@eicar.fr</a></div>
        </div>
    </div>

    <div class="main-content">
        <div class="carousel-stage" id="stage">
            
            <a href="project1.html" class="portfolio-item"><img src="p1.jpg"><div class="item-info">01</div></a>
            <a href="project2.html" class="portfolio-item"><img src="p2.jpg"><div class="item-info">02</div></a>
            <a href="project3.html" class="portfolio-item"><img src="p3.jpg"><div class="item-info">03</div></a>
            <a href="project4.html" class="portfolio-item"><img src="p4.jpg"><div class="item-info">04</div></a>
            <a href="project5.html" class="portfolio-item"><img src="p5.jpg"><div class="item-info">05</div></a>
            <a href="project6.html" class="portfolio-item"><img src="p6.jpg"><div class="item-info">06</div></a>
            <a href="project7.html" class="portfolio-item"><img src="p7.jpg"><div class="item-info">07</div></a>
            <a href="project8.html" class="portfolio-item"><img src="p8.jpg"><div class="item-info">08</div></a>
            <a href="project9.html" class="portfolio-item"><img src="p9.jpg"><div class="item-info">09</div></a>
            <a href="project10.html" class="portfolio-item"><img src="p10.jpg"><div class="item-info">10</div></a>
            <a href="project11.html" class="portfolio-item"><img src="p11.jpg"><div class="item-info">11</div></a>

        </div>
    </div>

    <script>
        const items = document.querySelectorAll('.portfolio-item');
        const totalItems = items.length;
        
        const angleUnit = 360 / totalItems;
        // Radius tuned for the precise layered file folder look in your reference images
        const radius = 240; 

        items.forEach((item, index) => {
            const itemAngle = angleUnit * index;
            
            // Re-engineered base layout: Sideways layout like library bookshelf slots
            const baseTransform = `rotateY(${itemAngle}deg) translateZ(${radius}px) rotateY(90deg)`;
            item.style.transform = baseTransform;
            item.style.setProperty('--current-transform', baseTransform);
            
            // Re-engineered snap-to-front flip configuration on focus
            const hoverFlipTransform = `rotateY(${itemAngle}deg) translateZ(${radius + 150}px) rotateY(0deg) scale(1.4)`;
            item.style.setProperty('--hover-flip-transform', hoverFlipTransform);
        });
    </script>

</body>
</html>
