<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guizhu YUE | Art Direction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff; 
            background-color: #000000; 
            display: flex;
            flex-direction: row;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Section */
        .sidebar {
            width: 320px;
            padding: 60px 40px;
            position: fixed;
            top: 0; 
            left: 0; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border-right: 1px solid #111111;
            z-index: 10;
            background-color: #000000;
        }
        .sidebar h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            color: #ffffff;
        }
        .sidebar .subtitle {
            font-size: 0.85rem;
            color: #888888;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .contact-item {
            margin-bottom: 25px;
        }
        .contact-label {
            font-size: 0.7rem;
            color: #444444;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .contact-value {
            font-size: 0.95rem;
            color: #aaaaaa;
            word-break: break-all;
        }
        .contact-value a {
            color: #aaaaaa;
            text-decoration: none;
            transition: color 0.3s;
        }
        .contact-value a:hover {
            color: #ffffff;
        }

        /* 3D Viewport Box */
        .main-content {
            margin-left: 320px;
            flex: 1;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; 
            position: relative;
            perspective: 2500px; 
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000000 70%);
        }
        
        /* 🚀 The 3D Carousel Stage - Lifted significantly upwards (translateY) 🚀 */
        .carousel-stage {
            width: 220px;
            height: 300px; 
            position: relative;
            transform-style: preserve-3d;
            /* Changed from -20px to -60px to drag the entire cluster higher up on the screen */
            transform: translateY(-60px); 
            animation: bookFlappingSpin 50s infinite linear;
        }
        
        /* 📖 Individual Book Pages (Edge-On By Default) */
        .portfolio-item {
            position: absolute;
            width: 220px; 
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: transparent;
            text-decoration: none;
            cursor: pointer;
            
            /* 🌟 CRITICAL: Set base opacity to 90% as requested for premium solid texture 🌟 */
            opacity: 0.90;
            filter: grayscale(10%);
            
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.3, 1), 
                        opacity 0.5s ease, 
                        filter 0.5s ease;
                        
            backface-visibility: visible; 
            display: block;
        }
        
        /* Scaled Editorial Images inside the leaf */
        .portfolio-item img {
            width: 100%;
            height: auto; 
            max-height: 300px; 
            object-fit: contain; 
            display: block;
            border-radius: 1px;
            /* Enhanced solid drop shadow because pages are now 90% opaque */
            box-shadow: -15px 20px 40px rgba(0, 0, 0, 0.95);
            background-color: #030303;
        }
        
        /* Minimalist Index Tag */
        .item-info {
            padding-top: 12px;
            font-size: 0.75rem;
            color: #666666;
            letter-spacing: 2px;
            text-align: center;
            transition: color 0.4s;
        }

        /* Hover System */
        .carousel-stage:has(.portfolio-item:hover) .portfolio-item:not(:hover) {
            opacity: 0.15; /* Temporarily dims down background elements on focus */
            filter: grayscale(70%) blur(1px);
        }

        .portfolio-item:hover {
            opacity: 1 !important;
            filter: grayscale(0%) !important;
            z-index: 500;
            transform: var(--hover-flip-transform) !important;
        }
        
        .portfolio-item:hover .item-info {
            color: #ffffff;
        }

        /* Pure Architectural Edge-On Auto Spinning Timeline */
        @keyframes bookFlappingSpin {
            0% { transform: rotateX(-14deg) rotateY(0deg); }
            100% { transform: rotateX(-14deg) rotateY(-360deg); }
        }

        /* 📱 Responsive Mobile Layout Transformation */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            .sidebar {
                width: 100%; position: relative; height: auto;
                padding: 40px 25px 20px 25px; border-right: none;
                border-bottom: 1px solid #111111;
            }
            .sidebar .subtitle { margin-bottom: 30px; }
            .main-content { 
                margin-left: 0; height: auto; padding: 60px 24px; 
                overflow: visible; background: none; display: block;
            }
            .carousel-stage { 
                width: 100%; height: auto; display: flex; flex-direction: column; 
                gap: 50px; transform: none !important; animation: none !important; 
            }
            .portfolio-item { 
                position: relative; width: 100%; transform: none !important; 
                opacity: 1 !important; filter: none !important;
            }
            .portfolio-item img { max-height: none; box-shadow: 0 10px 25px rgba(0,0,0,0.6); }
            .portfolio-item:hover { transform: scale(1.03) !important; }
            .item-info { text-align: left; color: #888888; }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Guizhu YUE</h1> 
        <div class="subtitle">Art Direction & Visual Strategies</div>
        
        <div class="contact-item">
            <div class="contact-label">TEL</div>
            <div class="contact-value"><a href="tel:+330695285161">+33 06 95 28 51 61</a></div>
        </div>
        
        <div class="contact-item">
            <div class="contact-label">MAIL</div>
            <div class="contact-value"><a href="mailto:guizhu.yue@eicar.fr">guizhu.yue@eicar.fr</a></div>
        </div>
    </div>

    <div class="main-content">
        <div class="carousel-stage" id="stage">
            
            <a href="project1.html" class="portfolio-item"><img src="p1.jpg"><div class="item-info">01</div></a>
            <a href="project2.html" class="portfolio-item"><img src="p2.jpg"><div class="item-info">02</div></a>
            <a href="project3.html" class="portfolio-item"><img src="p3.jpg"><div class="item-info">03</div></a>
            <a href="project4.html" class="portfolio-item"><img src="p4.jpg"><div class="item-info">04</div></a>
            <a href="project5.html" class="portfolio-item"><img src="p5.jpg"><div class="item-info">05</div></a>
            <a href="project6.html" class="portfolio-item"><img src="p6.jpg"><div class="item-info">06</div></a>
            <a href="project7.html" class="portfolio-item"><img src="p7.jpg"><div class="item-info">07</div></a>
            <a href="project8.html" class="portfolio-item"><img src="p8.jpg"><div class="item-info">08</div></a>
            <a href="project9.html" class="portfolio-item"><img src="p9.jpg"><div class="item-info">09</div></a>
            <a href="project10.html" class="portfolio-item"><img src="p10.jpg"><div class="item-info">10</div></a>
            <a href="project11.html" class="portfolio-item"><img src="p11.jpg"><div class="item-info">11</div></a>

        </div>
    </div>

    <script>
        const items = document.querySelectorAll('.portfolio-item');
        const totalItems = items.length;
        
        const angleUnit = 360 / totalItems;
        const radius = 260; 

        items.forEach((item, index) => {
            const itemAngle = angleUnit * index;
            
            const baseTransform = `rotateY(${itemAngle}deg) translateZ(${radius}px) rotateY(90deg)`;
            item.style.transform = baseTransform;
            item.style.setProperty('--current-transform', baseTransform);
            
            const hoverFlipTransform = `rotateY(${itemAngle}deg) translateZ(${radius + 160}px) rotateY(0deg) scale(1.45)`;
            item.style.setProperty('--hover-flip-transform', hoverFlipTransform);
        });
    </script>

</body>
</html>
