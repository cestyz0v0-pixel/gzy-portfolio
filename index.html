<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guizhu YUE | Art Direction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff; 
            background-color: #000000; 
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Left Side Info Panel */
        .sidebar {
            width: 280px;
            padding: 70px 45px;
            position: absolute;
            top: 0; 
            left: 0; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            z-index: 100;
            background-color: transparent;
            pointer-events: none; 
        }
        .sidebar * {
            pointer-events: auto; 
        }
        
        .sidebar h1 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .sidebar .subtitle {
            font-size: 0.58rem;
            color: #555555;
            margin-bottom: 55px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .contact-item {
            margin-bottom: 28px;
        }
        .contact-label {
            font-size: 0.58rem;
            color: #3f3f3f;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .contact-value {
            font-size: 0.68rem;
            color: #888888;
            letter-spacing: 0.5px;
        }
        .contact-value a {
            color: #888888;
            text-decoration: none;
            transition: color 0.3s;
        }
        .contact-value a:hover {
            color: #ffffff;
        }

        /* 3D Main Viewport */
        .main-content {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; 
            position: relative;
            perspective: 2500px; 
            overflow: hidden;
            background: #000000;
        }
        
        /* Centered & Elevated 3D Fan Stage */
        .carousel-stage {
            width: 170px;
            height: 240px; 
            position: relative;
            transform-style: preserve-3d;
            transform: translateY(-110px) rotateX(-54deg); 
            animation: fanDeckContinuousSpin 45s infinite linear;
        }
        
        .portfolio-item {
            position: absolute;
            width: 170px; 
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: transparent;
            text-decoration: none;
            cursor: pointer;
            opacity: 0.92;
            filter: grayscale(3%);
            transition: transform 0.85s cubic-bezier(0.19, 1, 0.22, 1), 
                        opacity 0.4s ease, 
                        filter 0.4s ease;
            backface-visibility: visible; 
            display: block;
        }
        
        .portfolio-item img {
            width: 100%;
            height: auto; 
            max-height: 240px; 
            object-fit: contain; 
            display: block;
            border-radius: 1px;
            box-shadow: -10px 12px 30px rgba(0, 0, 0, 0.95);
            background-color: #030303;
        }
        
        .item-info {
            padding-top: 10px;
            font-size: 0.55rem;
            color: #2a2a2a;
            letter-spacing: 2px;
            text-align: center;
            transition: color 0.4s;
        }

        /* Focus Animation */
        .carousel-stage:has(.portfolio-item:hover) .portfolio-item:not(:hover) {
            opacity: 0.05; 
            filter: grayscale(90%) blur(2px);
        }

        .portfolio-item:hover {
            opacity: 1 !important;
            filter: grayscale(0%) !important;
            z-index: 1000;
            transform: var(--hover-flip-transform) !important;
        }
        
        .portfolio-item:hover .item-info {
            color: #ffffff;
        }

        @keyframes fanDeckContinuousSpin {
            0% { transform: translateY(-110px) rotateX(-54deg) rotateY(0deg); }
            100% { transform: translateY(-110px) rotateX(-54deg) rotateY(-360deg); }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: hidden; }
            .sidebar {
                width: 100vw; height: auto; position: relative;
                padding: 40px 30px 10px 30px;
            }
            .main-content { 
                flex: 1; width: 100vw; height: auto;
                transform: scale(0.72) translateY(-60px); 
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Guizhu YUE</h1> 
        <div class="subtitle">Art Direction & Visual Strategies</div>
        
        <div class="contact-item">
            <div class="contact-label">TEL</div>
            <div class="contact-value"><a href="tel:+330695285161">+33 06 95 28 51 61</a></div>
        </div>
        
        <div class="contact-item">
            <div class="contact-label">MAIL</div>
            <div class="contact-value"><a href="mailto:guizhu.yue@eicar.fr">guizhu.yue@eicar.fr</a></div>
        </div>
    </div>

    <div class="main-content">
        <div class="carousel-stage" id="stage">
            
            <a href="project1.html" class="portfolio-item"><img src="p1.jpg"><div class="item-info">01</div></a>
            <a href="project2.html" class="portfolio-item"><img src="p2.jpg"><div class="item-info">02</div></a>
            <a href="project3.html" class="portfolio-item"><img src="p3.jpg"><div class="item-info">03</div></a>
            <a href="project4.html" class="portfolio-item"><img src="p4.jpg"><div class="item-info">04</div></a>
            <a href="project5.html" class="portfolio-item"><img src="p5.jpg"><div class="item-info">05</div></a>
            <a href="project6.html" class="portfolio-item"><img src="p6.jpg"><div class="item-info">06</div></a>
            <a href="project7.html" class="portfolio-item"><img src="p7.jpg"><div class="item-info">07</div></a>
            <a href="project8.html" class="portfolio-item"><img src="p8.jpg"><div class="item-info">08</div></a>
            <a href="project9.html" class="portfolio-item"><img src="p9.jpg"><div class="item-info">09</div></a>
            <a href="project10.html" class="portfolio-item"><img src="p10.jpg"><div class="item-info">10</div></a>
            <a href="project11.html" class="portfolio-item"><img src="p11.jpg"><div class="item-info">11</div></a>

        </div>
    </div>

    <script>
        const items = document.querySelectorAll('.portfolio-item');
        const totalItems = items.length;
        const angleUnit = 360 / totalItems;
        const radius = 230; 

        items.forEach((item, index) => {
            const itemAngle = angleUnit * index;
            
            const baseTransform = `rotateY(${itemAngle}deg) translateZ(${radius}px) rotateX(25deg) rotateZ(10deg)`;
            item.style.transform = baseTransform;
            item.style.setProperty('--current-transform', baseTransform);
            
            const hoverFlipTransform = `rotateY(${itemAngle}deg) translateZ(${radius + 200}px) rotateX(54deg) rotateY(0deg) rotateZ(0deg) scale(1.6)`;
            item.style.setProperty('--hover-flip-transform', hoverFlipTransform);
        });
    </script>
</body>
</html>
