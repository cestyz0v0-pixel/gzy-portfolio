<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guizhu YUE | Art Direction</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff; 
            background-color: #000000; 
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        /* Sidebar - Maintained from previous approved layout */
        .sidebar {
            width: 280px;
            padding: 70px 45px;
            position: absolute;
            top: 0; 
            left: 0; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            z-index: 100;
            background-color: transparent;
            pointer-events: none; 
        }
        .sidebar * { pointer-events: auto; }
        
        .sidebar h1 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .sidebar .subtitle {
            font-size: 0.58rem;
            color: #555555;
            margin-bottom: 55px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .contact-item { margin-bottom: 28px; }
        .contact-label {
            font-size: 0.58rem;
            color: #3f3f3f;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .contact-value {
            font-size: 0.68rem;
            color: #888888;
            letter-spacing: 0.5px;
        }
        .contact-value a {
            color: #888888;
            text-decoration: none;
            transition: color 0.3s;
        }
        .contact-value a:hover { color: #ffffff; }

        /* Main Viewport - Maintaining Centered Focus */
        .main-content {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center; 
            position: relative;
            perspective: 2500px; 
            overflow: hidden;
            background: #000000;
        }
        
        /* The Stable Carousel Stage - High Centered Position */
        .carousel-stage {
            width: 200px;
            height: 280px; 
            position: relative;
            transform-style: preserve-3d;
            transform: translateY(-80px); /* Maintained elevated position */
            animation: stableSpin 70s infinite linear;
        }
        
        .portfolio-item {
            position: absolute;
            width: 200px; 
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background-color: transparent;
            text-decoration: none;
            cursor: pointer;
            opacity: 0.90;
            filter: grayscale(10%);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), 
                        opacity 0.4s ease, filter 0.4s ease;
            backface-visibility: visible; 
            display: block;
        }
        
        .portfolio-item img {
            width: 100%;
            height: auto; 
            max-height: 280px; 
            object-fit: contain; 
            display: block;
            border-radius: 2px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85);
            background-color: #050505;
        }
        
        .item-info {
            padding-top: 10px;
            font-size: 0.75rem;
            color: #444444;
            letter-spacing: 2px;
            text-align: center;
            transition: color 0.4s;
        }

        /* Hover Effect: Keeps it simple and focused */
        .carousel-stage:has(.portfolio-item:hover) .portfolio-item:not(:hover) {
            opacity: 0.15;
            filter: grayscale(60%) blur(1px);
        }

        .portfolio-item:hover {
            opacity: 1 !important;
            filter: grayscale(0%) !important;
            z-index: 100;
            transform: var(--current-transform) translateZ(120px) scale(1.3) !important;
        }
        
        .portfolio-item:hover .item-info { color: #ffffff; }

        /* Stable Rotation Engine */
        @keyframes stableSpin {
            from { transform: rotateX(-12deg) rotateY(0deg); }
            to { transform: rotateX(-12deg) rotateY(-360deg); }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow: hidden; }
            .sidebar { width: 100vw; height: auto; position: relative; padding: 40px 30px 10px 30px; }
            .main-content { transform: scale(0.85) translateY(-40px); }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h1>Guizhu YUE</h1> 
        <div class="subtitle">Art Direction & Visual Strategies</div>
        <div class="contact-item">
            <div class="contact-label">TEL</div>
            <div class="contact-value"><a href="tel:+330695285161">+33 06 95 28 51 61</a></div>
        </div>
        <div class="contact-item">
            <div class="contact-label">MAIL</div>
            <div class="contact-value"><a href="mailto:guizhu.yue@eicar.fr">guizhu.yue@eicar.fr</a></div>
        </div>
    </div>

    <div class="main-content">
        <div class="carousel-stage" id="stage">
            <a href="project1.html" class="portfolio-item"><img src="p1.jpg"><div class="item-info">01</div></a>
            <a href="project2.html" class="portfolio-item"><img src="p2.jpg"><div class="item-info">02</div></a>
            <a href="project3.html" class="portfolio-item"><img src="p3.jpg"><div class="item-info">03</div></a>
            <a href="project4.html" class="portfolio-item"><img src="p4.jpg"><div class="item-info">04</div></a>
            <a href="project5.html" class="portfolio-item"><img src="p5.jpg"><div class="item-info">05</div></a>
            <a href="project6.html" class="portfolio-item"><img src="p6.jpg"><div class="item-info">06</div></a>
            <a href="project7.html" class="portfolio-item"><img src="p7.jpg"><div class="item-info">07</div></a>
            <a href="project8.html" class="portfolio-item"><img src="p8.jpg"><div class="item-info">08</div></a>
            <a href="project9.html" class="portfolio-item"><img src="p9.jpg"><div class="item-info">09</div></a>
            <a href="project10.html" class="portfolio-item"><img src="p10.jpg"><div class="item-info">10</div></a>
            <a href="project11.html" class="portfolio-item"><img src="p11.jpg"><div class="item-info">11</div></a>
        </div>
    </div>

    <script>
        const items = document.querySelectorAll('.portfolio-item');
        const totalItems = items.length;
        const angleUnit = 360 / totalItems;
        const radius = 240; 

        items.forEach((item, index) => {
            const itemAngle = angleUnit * index;
            const transformString = `rotateY(${itemAngle}deg) translateZ(${radius}px)`;
            item.style.transform = transformString;
            item.style.setProperty('--current-transform', transformString);
        });
    </script>
</body>
</html>
